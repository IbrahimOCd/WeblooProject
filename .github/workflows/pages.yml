# Publishes dist/ (built by ./build.sh and committed) to GitHub Pages on every push to main.
# Two jobs, as in GitHub's own Pages template: "upload" stores the site, "deploy" starts once the upload
# is fully registered (deploying in the same job sometimes could not find the files yet).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # let a running deploy finish (GitHub's recommendation for Pages)

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
